<title>QuickCart — Groceries in 10 minutes</title>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--card:#16261c;--ink:#e8f5ec;--mute:#93ad9b;--line:#23382a;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1a12;--card:#16261c;--ink:#e8f5ec;--mute:#93ad9b;--line:#23382a;--shadow:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{font-weight:800;font-size:22px;color:var(--brand);cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
.search{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus{border-color:var(--brand)}
.ibtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:600;white-space:nowrap}
.badge{position:absolute;top:-6px;right:-4px;background:var(--accent);color:#000;border-radius:999px;font-size:11px;padding:2px 6px;font-weight:800}
.hero{position:relative;overflow:hidden;margin:18px 0;border-radius:28px;padding:48px 32px;background:linear-gradient(135deg,#0f8f47,#20c46a);color:#fff}
.hero h1{font-size:clamp(28px,5vw,52px);line-height:1.05;max-width:560px;position:relative}
.hero p{margin:14px 0 22px;max-width:440px;opacity:.92;position:relative}
.hero .stats{display:flex;gap:22px;flex-wrap:wrap;position:relative}
.hero .stats b{display:block;font-size:22px}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25;background:#fff}
.b1{width:260px;height:260px;right:-60px;top:-60px}.b2{width:140px;height:140px;right:180px;bottom:-40px;background:var(--accent)}
.emojis{position:absolute;right:30px;bottom:14px;font-size:64px;letter-spacing:8px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.chip{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 14px}
.row select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.pic{font-size:60px;text-align:center;padding:14px 0;background:var(--bg);border-radius:14px}
.card h3{font-size:15px;margin:10px 0 2px}
.card small{color:var(--mute)}
.price{display:flex;align-items:baseline;gap:6px;margin:8px 0}
.price b{font-size:17px}.price s{color:var(--mute);font-size:12px}
.off{position:absolute;top:10px;left:10px;background:var(--accent);color:#000;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}
.add{width:100%;padding:9px;border-radius:12px;background:transparent;border:1.5px solid var(--brand);color:var(--brand);font-weight:800}
.add:hover{background:var(--brand);color:#fff}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;border-radius:12px;padding:4px}
.step button{background:transparent;color:#fff;width:34px;height:32px;font-size:20px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--mute)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.drawer .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:14px 0}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.li .e{font-size:30px}.li .m{flex:1;min-width:0}.li .step{width:96px}
.bill div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute)}
.bill .t{color:var(--ink);font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.cta{width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;margin-top:10px}
.cta:disabled{opacity:.45;cursor:not-allowed}
.coupon{display:flex;gap:8px;margin:8px 0}
.coupon input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-transform:uppercase}
.coupon button{padding:0 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700}
.msg{font-size:12px;color:var(--brand)}.msg.err{color:#d33}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;padding:24px 0 50px}
@media(max-width:820px){.two{grid-template-columns:1fr}.hero{padding:32px 22px}.emojis{display:none}.bar-row{flex-wrap:wrap}.logo{order:1}.search{order:3;flex-basis:100%}.ibtn{order:2}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field input,.field select{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field .err{color:#d33;font-size:12px}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay label{flex:1;min-width:110px;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.pay input{display:none}.pay label.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.track{max-width:640px;margin:30px auto 60px;text-align:center}
.rider{font-size:70px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:22px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px;color:var(--mute)}
.steps .done{color:var(--brand);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:60;font-weight:600;font-size:14px}
footer{text-align:center;color:var(--mute);padding:30px 0 40px;font-size:13px}

function Bill({bill}){return h("div",{className:"bill"},

  bill.disc>0&&h("div",null,h("span",null,"Coupon discount"),h("span",null,"−"+inr(bill.disc))),

function Home({q,cat,setCat,sort,setSort,cart,add,dec}){
  const list=useMemo(()=>{let l=P.filter(p=>(cat==="All"||p.c===cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
    if(sort==="low")l=[...l].sort((a,b)=>a.p-b.p);if(sort==="high")l=[...l].sort((a,b)=>b.p-a.p);
    if(sort==="off")l=[...l].sort((a,b)=>b.o/b.p-a.o/a.p);return l},[q,cat,sort]);

    gsap.set(".card",{opacity:0,y:40});

    ScrollTrigger.refresh();return()=>st.forEach(s=>s.kill())},[list]);

    const a=gsap.to(".b1",{yPercent:40,scrollTrigger:{trigger:".hero",start:"top top",end:"bottom top",scrub:true}});

      h("div",{className:"stats"},[["10 min","avg delivery"],["2,000+","products"],["₹0","fee over ₹499"]].map(s=>h("div",{key:s[1]},h("b",null,s[0]),s[1]))),
      h("div",{className:"emojis"},"🥑🍓🥛")),
    h("div",{className:"chips"},CATS.map(c=>h("button",{key:c,className:"chip"+(c===cat?" on":""),onClick:()=>setCat(c)},c))),
    h("div",{className:"row"},h("h2",null,cat==="All"?"Popular right now":cat),
      h("select",{value:sort,onChange:e=>setSort(e.target.value),"aria-label":"Sort"},h("option",{value:"rec"},"Recommended"),h("option",{value:"low"},"Price: low to high"),h("option",{value:"high"},"Price: high to low"),h("option",{value:"off"},"Biggest discount"))),
    h("div",{className:"grid"},list.length?list.map(p=>h(Card,{key:p.id,p,q:cart[p.id]||0,add:()=>add(p.id),dec:()=>dec(p.id)})):h("div",{className:"empty"},"😕 No items match “"+q+"”")));

function Checkout({items,bill,onBack,onPlace}){
  const[f,setF]=useState({name:"",phone:"",addr:"",slot:"ASAP (10 min)",pay:"UPI"}),[er,setEr]=useState({});

    h("div",{className:"panel"},h("h2",null,"Delivery details"),

      h("button",{className:"cta",disabled:!items.length,onClick:submit},"Place order · "+inr(bill.total)),
      h("button",{className:"chip",style:{marginTop:10},onClick:onBack},"← Keep shopping")),
    h("div",{className:"panel"},h("h2",null,"Order summary"),
      items.map(i=>h("div",{key:i.id,className:"li",style:{marginBottom:8}},h("span",{className:"e"},i.e),h("div",{className:"m"},h("b",null,i.n),h("div",null,h("small",null,i.q+" × "+inr(i.p)))),h("b",null,inr(i.q*i.p)))),
      h(Bill,{bill}))));

function Track({order,onHome}){
  const S=["Order placed","Packing","Out for delivery","Delivered"],[s,setS]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setS(x=>Math.min(x+1,3)),3500);return()=>clearInterval(t)},[]);

    gsap.fromTo(".rider",{y:0},{y:-14,repeat:s<3?-1:0,yoyo:true,duration:.5,ease:"sine.inOut"})},[s]);
  useEffect(()=>{gsap.from(".track>*",{y:24,opacity:0,stagger:.1,duration:.6})},[]);
  const eta=[10,7,4,0][s];
  return h("div",{className:"wrap"},h("div",{className:"track panel"},
    h("div",{className:"rider"},s===3?"🎉":s===2?"🛵":s===1?"📦":"✅"),
    h("h2",null,s===3?"Delivered! Enjoy your groceries":"Arriving in "+eta+" min"),
    h("p",{style:{color:"var(--mute)"}},"Order #"+order.id+" · "+order.pay+" · "+inr(order.total)),
    h("div",{className:"prog"},h("i")),
    h("div",{className:"steps"},S.map((x,i)=>h("div",{key:x,className:i<=s?"done":""},(i<=s?"● ":"○ ")+x))),
    h("p",{style:{margin:"20px 0 6px",fontSize:13,color:"var(--mute)"}},"Delivering to: "+order.addr),
    h("button",{className:"cta",onClick:onHome},"Back to store")));
}

function App(){
  const[view,setView]=useState("home"),[cart,setCart]=useLS("qc_cart",{}),[coupon,setCoupon]=useState({}),
    [q,setQ]=useState(""),[cat,setCat]=useState("All"),[sort,setSort]=useState("rec"),[open,setOpen]=useState(false),
    [order,setOrder]=useState(null),[toast,setToast]=useState(""),[mute,setMute]=useState(false),[,tick]=useState(0),[dark,setDark]=useState(()=>matchMedia("(prefers-color-scheme: dark)").matches);
  const main=useRef();
  useEffect(()=>{document.documentElement.dataset.theme=dark?"dark":"light"},[dark]);
  const items=Object.keys(cart).map(id=>({...P.find(p=>p.id==id),q:cart[id]})).filter(i=>i.id);
  const count=items.reduce((a,i)=>a+i.q,0),sub=items.reduce((a,i)=>a+i.q*i.p,0);
  const disc=coupon.code==="QUICK10"?Math.round(sub*.1):coupon.code==="FIRST50"&&sub>=299?50:0;
  const fee=sub===0||sub>=499?0:30,bill={sub,disc,fee,total:Math.max(0,sub-disc+fee)};

  useLayoutEffect(()=>{gsap.fromTo(main.current,{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:"power3.out"})},[view]);
  const go=v=>gsap.to(main.current,{opacity:0,y:-18,duration:.25,ease:"power2.in",onComplete:()=>{setView(v);window.scrollTo(0,0)}});
  const place=async f=>{let id="QC"+Math.floor(10000+Math.random()*90000),total=bill.total;
    try{const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...f,items:cart,coupon:coupon.code||""})});if(r.ok){const d=await r.json();id=d.code;total=d.total}}catch(e){}

  useEffect(()=>{fetch("/api/products").then(r=>r.ok?r.json():Promise.reject()).then(rows=>{if(rows.length){P.splice(0,P.length,...rows);tick(x=>x+1)}}).catch(()=>{})},[]);

    h("header",null,h("div",{className:"wrap bar-row"},
      h("div",{className:"logo",onClick:()=>go("home")},"Quick",h("span",null,"Cart")),
      h("input",{className:"search",placeholder:"Search “milk”, “bananas”…",value:q,onChange:e=>{setQ(e.target.value);if(view!=="home")go("home")},"aria-label":"Search"}),
      h("button",{className:"ibtn",onClick:()=>{muted=!mute;setMute(!mute);if(mute)chime()},"aria-label":"Toggle sound"},mute?"🔕":"🔔"),
      h("button",{className:"ibtn",onClick:()=>setDark(!dark),"aria-label":"Toggle theme"},dark?"☀️":"🌙"),

    h("main",{ref:main},
      view==="home"&&h(Home,{q,cat,setCat,sort,setSort,cart,add,dec}),
      view==="checkout"&&h(Checkout,{items,bill,onBack:()=>go("home"),onPlace:place}),
      view==="track"&&order&&h(Track,{order,onHome:()=>go("home")})),
    h("footer",null,"QuickCart · UI demo built with React & GSAP"),
